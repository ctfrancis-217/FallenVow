 {id:'stagger',date:'Nov 7, 2026',t:'Bosses keep their footing',d:'A flurry of light hits no longer stumbles a named boss. A halberd, greatsword, great axe, or ultra greatsword still staggers one for a short moment, and a second hit does not extend that moment. The elite who rules a throne room stumbles for less time than an ordinary foe. Other enemies are unchanged. A successful Aegis Shard parry still stuns its target for 1 second.'},
 {id:'loot',date:'Nov 7, 2026',t:'Coin urns count as loot',d:'A room is not finished while a coin urn is still standing, or while a soul coin, heart, draught, lore page, or chest you can still open is on the floor. The map stays marked, and leaving the floor asks you to stay, until those are taken. A fairy chest that sealed because you were hit still does not count. Smashing an urn or picking up the last coin updates the mark immediately.'},
 {id:'earn',date:'Nov 7, 2026',t:'Coins from this run',d:'The corner tally now keeps a running count of gold and Soul Coins you collect during a run. Gold you can still spend, and the Soul Coins already in your purse, stay on their own lines. Buying something does not lower the run count. A new run starts it over. Continuing, changing floors, and resuming keep it.'},
 {id:'walk',date:'Nov 7, 2026',t:'The knight walks forward',d:'The Black Knight\u2019s run cycle planted a foot and then slid it forward, so he looked like he was walking backward. His feet now step forward when he runs. If you aim the bow behind you while moving, he keeps facing the shot and backpedals. Idle, jumps, and weapon poses are unchanged.'},

 {id:'bank',date:'Nov 7, 2026',t:'Ashenmere Bank and the gate',d:'The bank has no storage cap. Deposit any gold you carry. Withdrawals still cost 10%, and banked gold is still safe when you die. Starting a run no longer gives the Gatekeeper every coin in your vault. He charges 25g (20% less per level of Charon\u2019s Bargain: 20g, 15g, then 10g). The toll comes from the vault first, and from the bank only if the vault is short. If you cannot pay it, he lets you through and you keep what you have. Continuing a saved run does not charge it again.'},
 {id:'36',date:'Nov 6, 2026',t:'Floor map and the way out',d:'The floor map marks loot as soon as it changes. Gold means a chest or pickup is still there. Cyan means the fairy chest can still be opened. A green check means nothing obtainable is left. A fairy chest that sealed because you were hit does not count, and leaving the floor does not ask you to stay when that is all that remains.'},
 {id:'35',date:'Nov 6, 2026',t:'Spear and Aegis Shard',d:'The spear attacks 15% slower. With no direction it still thrusts, and every third thrust is a double jab. Hold up for a rising swing. Hold down on the ground for a spinning leg sweep. Hold down in the air and it still plunges and bounces. Aegis Shard opens with a 0.2 second parry: a physical blow stuns that attacker for 1 second, and a spell or ranged shot is sent back. The barrier then blocks for the rest of its time. Dark Aegis is unchanged.'},
 {id:'34',date:'Nov 6, 2026',t:'Ultra greatsword',d:'The ultra greatsword\u2019s hit follows the blade through the chop, instead of a box that missed the tip. Its stats and the shoulder windup are unchanged.'},
 {id:'33',date:'Nov 6, 2026',t:'Slow weapons, spear thrust, and the bow',d:'Slow weapons no longer crash the game when they swing. The spear thrusts in a straight line: a short pullback, a lunge, and a retract, with no slash smear. On a desktop the bow aims at the cursor. Esc pauses and resumes without firing a held shot.'},
