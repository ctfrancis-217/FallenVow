 {id:'board',x:-60,w:36,n:'Notice Board',k:'Read records',need:()=>1,why:'Always here',f:()=>statsScreen(hubBack)},
 {id:'herb',x:-130,w:50,n:'Herbalist',k:'Visit herbalist',need:()=>Object.keys(meta.stats.fast).length>0,why:'Defeat your first boss',f:()=>modal('The Herbalist','<i>"Bitter roots and grave-moss. It\u2019ll keep your heir breathing."</i>'+(meta.townBuy.pot?'<br><br><b style="color:#6fe86f">A draught is packed for your next run.</b>':''),[{t:'Pack a Draught for the next run (30g)',p:1,dis:meta.gold<30||meta.townBuy.pot,f:()=>{meta.gold-=30;meta.townBuy.pot=1;saveMeta();sfx('coin');hubBack()}},{t:'Leave',f:hubBack}])},
 {id:'chapel',x:-210,w:54,n:'Chapel of Dawn',k:'Pray',need:()=>meta.stats.bestAct>=2,why:'Reach Act 2',f:()=>modal('Chapel of Dawn','<i>The last priest of Aldric\u2019s order. "Even fallen blood may be blessed."</i>'+(meta.townBuy.bless?'<br><br><b style="color:#6fe86f">Your next heir is blessed.</b>':''),[{t:'Blessing: +1 Max Heart next run (40g)',p:1,dis:meta.gold<40||meta.townBuy.bless,f:()=>{meta.gold-=40;meta.townBuy.bless=1;saveMeta();sfx('relic');hubBack()}},{t:'Leave',f:hubBack}])},
 {id:'tavern',x:-300,w:64,n:'The Last Candle',k:'Enter tavern',need:()=>meta.stats.runs>=10,why:'Begin 10 runs',f:()=>{const tips=['"Dread foes glow red. Kill one and its ashes leave cursed treasure."','"Bank your gold before the road. The Gatekeeper can\u2019t touch the vault."','"Hold two matching relics and they sing together. Synergies, the scholars call it."','"The Lich Lord hates being rushed. Strike when his rings close."','"They say Aldric wept the night he opened Highmere\u2019s gates."'];const left=LORE.map((_,i)=>i).filter(i=>!meta.journal.includes(i));let extra='';if(left.length&&!meta.townBuy.tale){meta.journal.push(left[0]);meta.townBuy.tale=1;saveMeta();extra=`<br><br><b style="color:#ffd24a">The bard\u2019s song becomes a lore page: "${LORE[left[0]][0]}"</b>`}modal('The Last Candle',`<i>${tips[R(tips.length)]}</i>`+extra,[{t:'Leave',p:1,f:hubBack}])}},
 {id:'squire',x:-380,w:46,n:'Old Squire',k:'Talk',need:()=>meta.stats.deaths>=3,why:'Fall 3 times',f:()=>{let g='';if(!meta.townBuy.squire){meta.townBuy.squire=1;meta.souls+=25;saveMeta();g='<br><br><b style="color:#b05ae0">He hands you a pouch: +25 Soul Coins.</b>'}modal('The Old Squire',`<i>"I carried Aldric\u2019s shield once. Down-slash bounces you off foes, and a dash through shots is safer than a jump."</i>`+g,[{t:'Leave',p:1,f:hubBack}])}}];
const townOn=()=>TOWNX.filter(b=>b.need());
function townCheck(){const nw=townOn().filter(b=>!meta.town.includes(b.id));if(!nw.length)return;for(const b of nw)meta.town.push(b.id);saveMeta();if(meta.town.length>1||nw[0].id!='board'){const t=nw.filter(b=>b.id!='board');if(t.length){synToast('ASHENMERE GROWS',t.map(b=>`New: ${b.n} (${b.why.toLowerCase()})`).join('<br>'));sfx('relic')}}}
{const _eh=enterHub;enterHub=function(){_eh.apply(this,arguments);townCheck()}}
const HUBMIN=()=>Math.min(0,...TOWNX.map(b=>b.x-30));
{const _hn=hubNear;hubNear=function(){const s=_hn();if(s)return s;return townOn().find(b=>Math.abs(HB2.x+3-(b.x+b.w/2))<b.w/2+6)}}
{const _hs=hubStation;hubStation=function(id){const b=TOWNX.find(b=>b.id==id);if(b)return b.f();return _hs(id)}}
function hubExtra(X,Y,Rr,Zh,t){Rr('#2a2430',HUBMIN()-200,HGY,-(HUBMIN()-200),40);for(let y=0;y<6;y++)for(let x=HUBMIN()-200-((y%2)*4);x<0;x+=8)Rr(hsh(x*.3+y)>.5?'#3a3440':'#332d3a',x+.5,HGY+y*4+.5,7,3);
 const glow=(x,y,r,c)=>{cx.globalCompositeOperation='lighter';const g=cx.createRadialGradient(X(x),Y(y),0,X(x),Y(y),r*Zh);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(X(x-r),Y(y-r),2*r*Zh,2*r*Zh);cx.globalCompositeOperation='source-over'};
 for(const b of townOn()){const x=b.x,w=b.w;if(b.id=='board'){Rr('#3a2418',x+4,HGY-30,3,30);Rr('#3a2418',x+w-7,HGY-30,3,30);Rr('#5a3a22',x,HGY-34,w,20);Rr('#e8dcc0',x+4,HGY-31,10,8);Rr('#e8dcc0',x+18,HGY-30,12,10);Rr('#c8b890',x+6,HGY-22,8,6);Rr('#e0403a',x+8,HGY-30,1,1);Rr('#e0403a',x+23,HGY-29,1,1);glow(x+w/2,HGY-24,18,'rgba(255,200,120,.2)')}
  else{const roof={herb:'#2a5a2a',chapel:'#d8d0c0',tavern:'#6a2a1a',squire:'#4a4a5a'}[b.id],wall={herb:'#4a3a28',chapel:'#8a8090',tavern:'#4a3020',squire:'#3a3430'}[b.id],hh={herb:34,chapel:50,tavern:44,squire:28}[b.id];
   Rr(wall,x,HGY-hh,w,hh);for(let i=0;i<w;i+=8)Rr('rgba(0,0,0,.18)',x+i,HGY-hh,1,hh);cx.fillStyle=roof;cx.beginPath();cx.moveTo(X(x-4),Y(HGY-hh));cx.lineTo(X(x+w/2),Y(HGY-hh-w*.42));cx.lineTo(X(x+w+4),Y(HGY-hh));cx.fill();
   Rr('#2a1810',x+w/2-5,HGY-14,10,14);Rr('#5a3a22',x+w/2-4,HGY-13,8,13);const lit=hsh(x+Math.floor(t/90))>.1;Rr(lit?'#ffb040':'#3a2a30',x+5,HGY-hh+8,6,6);if(lit)glow(x+8,HGY-hh+11,14,'rgba(255,170,60,.3)');
   if(b.id=='chapel'){Rr('#ffd24a',x+w/2-1,HGY-hh-w*.42-8,2,8);Rr('#ffd24a',x+w/2-3,HGY-hh-w*.42-6,6,2);glow(x+w/2,HGY-hh-10,30,'rgba(255,230,150,.25)')}
   if(b.id=='herb'){for(let i=0;i<4;i++)Rr(['#6ccf3a','#3a8a2a','#c8e06a','#6ccf3a'][i],x+w-14+i*3,HGY-hh+4,2,6)}
   if(b.id=='tavern'){Rr('#3a2418',x+w-4,HGY-hh+2,10,2);Rr('#c9a24a',x+w+2,HGY-hh+4,6,6);for(let i=0;i<3;i++)Rr('#ffd24a',x+12+i*14,HGY-hh+20,6,5);CK_smoke(X(x+w-10),Y(HGY-hh-30),t,Zh)}
   if(b.id=='squire'){Rr('#8a6a4a',x+w+4,HGY-18,2,18);Rr('#c8b890',x+w+1,HGY-16,8,6);Rr('#6a6a7a',x+w+2,HGY-24,6,6)}}
  const near=hubNear()==b;cx.textAlign='center';cx.font=`bold ${Math.max(11,Zh*4)}px "Courier New",monospace`;cx.fillStyle='#120c18';cx.fillText(b.n.toUpperCase(),X(b.x+b.w/2)+2,Y(HGY-72)+2);cx.fillStyle=near?'#ffd24a':'#c8bca0';cx.fillText(b.n.toUpperCase(),X(b.x+b.w/2),Y(HGY-72));
  if(near){const tx=`[${KM.inter.map(kname).join('/')}] ${b.k}`;cx.font=`bold ${Math.max(12,Zh*4.4)}px "Courier New",monospace`;const w2=cx.measureText(tx).width+16,bx=X(HB2.x+3)-w2/2,by=Y(HB2.y-14)-Zh*4;cx.fillStyle='#1e1a34';cx.fillRect(bx,by-16,w2,24);cx.strokeStyle='#c9a24a';cx.lineWidth=2;cx.strokeRect(bx,by-16,w2,24);cx.fillStyle='#ffd24a';cx.fillText(tx,bx+w2/2,by+1)}cx.textAlign='left'}
 // locked plots hint
 const lk=TOWNX.filter(b=>!b.need());for(const b of lk){Rr('#1a1218',b.x+4,HGY-10,b.w-8,10);cx.textAlign='center';cx.font=`bold ${Math.max(10,Zh*3)}px "Courier New",monospace`;cx.fillStyle='#6a5a5a';cx.fillText('LOCKED: '+b.why.toUpperCase(),X(b.x+b.w/2),Y(HGY-16));cx.textAlign='left'}}

// ---------- compact heir cards (phones / tablets) ----------
function heirCompact(){return innerHeight<520||(TC.on&&innerHeight<=820)}
window.pickHeir=i=>{meta.chosen=i;saveMeta();sfx('relic');hubBack()};
window.traitInfo=(id,el)=>{const t=TB[id];if(!t)return;$('tdet').innerHTML=`<b style="color:#f2a05a">${t.n}</b>: ${t.d}`;event&&event.stopPropagation&&event.stopPropagation()};
{const _hsel=heirSelect;heirSelect=function(){if(!heirCompact())return _hsel();if(!meta.heirs){meta.heirs=rollHeirs();saveMeta()}const H=meta.heirs,big=innerHeight>600,ps=big?64:44;
 const card=(h,i)=>{const sp=SPELLS[h.spell],gb=h.traits.reduce((a,t)=>a+TB[t].g,0),sel=i==meta.chosen;
  return`<div onclick="pickHeir(${i})" style="flex:1;min-width:0;cursor:pointer;border:3px solid ${sel?'#ffd24a':'#5a4630'};background:${sel?'#2e2448':'#1e1a34'};padding:6px;display:flex;flex-direction:column;gap:4px;font-size:${big?12:10}px;line-height:1.25">
  <div style="display:flex;gap:6px;align-items:center"><img src="${heirImg(h)}" width="${ps}" height="${ps}" style="image-rendering:pixelated;flex:none;background:#0b0e1c;border:2px solid #5a4630"><div style="min-width:0"><b style="color:#ffd24a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">${sel?'\u2605 ':''}${h.name}</b><span style="color:#6fc8ff">${sp.n} (${sp.c}MP)</span>${gb?`<br><span style="color:#ffd24a">+${Math.round(gb*100)}% gold</span>`:''}</div></div>
  <div style="display:flex;flex-wrap:wrap;gap:3px">${h.traits.length?h.traits.map(t=>`<span onclick="event.stopPropagation();traitInfo('${t}')" style="padding:2px 5px;border:2px solid #f2a05a;background:#3a2418;color:#f2c48a;font-size:${big?11:9}px;white-space:nowrap">${TB[t].n} &#9432;</span>`).join(''):'<small style="color:#888">No traits</small>'}</div>
  <div style="margin-top:auto;text-align:center;border:2px solid ${sel?'#ffd24a':'#5a4630'};padding:3px;color:${sel?'#ffd24a':'#e8e0d0'}">${sel?'CHOSEN':'CHOOSE'}</div></div>`};
 modal('',`<div style="text-align:center;font-size:${big?13:11}px;margin-bottom:5px"><b style="color:#ffd24a">BLOOD OF THE FALLEN PALADIN</b> <span style="color:#c890ff">&middot; Year ${vowYear()} of the Vow &middot; Gen ${meta.gen}</span></div><div style="display:flex;gap:6px">${H.map(card).join('')}</div><div id="tdet" style="min-height:16px;margin-top:5px;font-size:${big?12:10}px;color:#c8bca0;text-align:center">Tap a card to choose &middot; tap a trait for details</div>`,
  H.map((h,i)=>({t:`Choose ${h.name}`,p:i==meta.chosen,f:()=>pickHeir(i),hide:1})).concat([{t:'Back to town',f:hubBack}]),1);
 $('box').classList.add('heirc')}}
